media:
  input: assets/img/produtos
  output: ./assets/img/produtos

content:
  - name: configuracoes
    label: "⚙️ Configurações da Loja & Frete"
    type: file
    path: configuracoes.json
    fields:
      - name: cep_origem
        label: "CEP de Origem da Loja (Cálculo de Frete)"
        type: string
        default: "29101010"
        description: "CEP de onde saem os envios da Cube Forge (ex: 29101010 - Vila Velha/ES)."
      - name: melhorenvio_token
        label: "Token da API do Melhor Envio (Opcional)"
        type: string
        description: "Cole seu token Bearer da API do Melhor Envio para cotar na sua conta. Se vazio, o site usa cálculo inteligente de mercado."
      - name: melhorenvio_sandbox
        label: "Usar Sandbox do Melhor Envio (Testes)"
        type: boolean
        default: false
        description: "Marque se estiver usando um token do ambiente de testes sandbox do Melhor Envio."
      - name: modo_manutencao
        label: "Ativar Modo de Manutenção (Desativar Site & Vendas)"
        type: boolean
        default: false
        description: "Ligue este interruptor para pausar o site temporariamente. O site exibirá um aviso elegante de manutenção informando que volta em breve, pausando as vendas e oferecendo botões diretos de contato via WhatsApp e Instagram."
      - name: titulo_manutencao
        label: Título do Aviso
        type: string
        default: "Estamos em Manutenção"
        description: "Título principal na tela de manutenção."
      - name: subtitulo_manutencao
        label: Subtítulo
        type: string
        default: "Voltamos em breve com novidades!"
        description: "Frase de apoio abaixo do título."
      - name: mensagem_manutencao
        label: Mensagem para os Clientes
        type: text
        default: "Estamos realizando ajustes em nossos equipamentos, estoque e catálogo para trazer peças exclusivas com a máxima qualidade. Nossas compras online voltam em breve!\n\nEnquanto isso, você pode encomendar, orçar ou tirar dúvidas diretamente pelo nosso WhatsApp ou Instagram."
        description: "Texto explicativo detalhado exibido para os clientes durante a pausa."
      - name: previsao_retorno
        label: Previsão de Retorno (Tag em Destaque)
        type: string
        default: "Voltamos em breve!"
        description: "Ex: 'Voltamos em breve!', 'Retorno hoje às 19h', 'Previsão: amanhã cedo'."

  - name: produtos
    label: Catálogo de Produtos
    type: file
    path: produtos.json
    list: true
    fields:
      - name: id
        label: ID
        type: number
      - name: nome
        label: Nome
        type: string
        required: true
      - name: preco
        label: Preço
        type: string
        required: true
      - name: categoria
        label: Categoria
        type: select
        options:
          placeholder: "Selecione uma categoria..."
          values:
            - name: colecionaveis
              label: "🐉 Colecionáveis"
            - name: decoracao
              label: "🌿 Decoração"
            - name: setup
              label: "🎧 Setup & Suportes"
            - name: personalizados
              label: "🎁 Presentes"
            - name: geek
              label: "🎮 Geek & Games"
            - name: iluminacao
              label: "💡 Iluminação & Litofanias"
            - name: utilidades
              label: "🛠️ Utilidades & Casa"
            - name: cosplay
              label: "🎭 Cosplay & Acessórios"
            - name: miniaturas
              label: "🎲 Miniaturas & RPG"
            - name: nova
              label: "✨ Criar Nova Categoria (digitar abaixo)"
      - name: nova_categoria
        label: Criar Nova Categoria (Nome)
        type: string
        description: "Selecione 'Criar Nova Categoria' acima e digite o nome aqui (ex: Canecas, Vasos, Chaveiros). Ela aparecerá automaticamente nos filtros do site!"
      - name: categoria_icone
        label: Emoji da Categoria (Opcional)
        type: string
        description: "Emoji para o botão de filtro (ex: 🏆, ☕, 💎, 🐉). Se vazio, o site escolhe um ícone inteligente."
      - name: descricao
        label: Descrição
        type: text
      - name: imagem
        label: Foto
        type: image
      - name: disponivel
        label: Disponível no Catálogo
        type: boolean
        default: true
      - name: destaque
        label: Exibir nos Destaques (Vitrine do Topo)
        type: boolean
        default: true
        description: "Ative este botão para exibir este produto no carrossel de destaques no topo do site (Showroom). Se desativado, ele continua visível no catálogo abaixo, mas não aparece nos destaques."
      - name: somente_encomenda
        label: Somente sob Encomenda
        type: boolean
        default: false
        description: "Ative este botão para produtos que são fabricados exclusivamente sob encomenda. Ele continuará aparecendo no catálogo e no carrinho com o selo '📦 Somente sob Encomenda', a compra online fica desativada e o cliente tem a opção de encomendar diretamente pelo WhatsApp."
      - name: estoque
        label: Estoque a Pronta Entrega (Qtd)
        type: number
        default: 0
        description: "Quantidade de peças já impressas prontas para envio imediato. Se for 1 ou mais, o site ativa o selo de urgência '⚡ Pronta Entrega'. Deixe 0 se a peça for apenas sob encomenda."
