media:
  input: assets/img/produtos
  output: ./assets/img/produtos

content:
  - name: produtos
    label: Catálogo de Produtos
    type: file
    path: produtos.json
    list: true
    fields:
      - name: id
        label: ID
        type: number
      - name: nome
        label: Nome
        type: string
        required: true
      - name: preco
        label: Preço
        type: string
        required: true
      - name: categoria
        label: Categoria
        type: select
        options:
          placeholder: "Selecione uma categoria..."
          values:
            - name: colecionaveis
              label: "🐉 Colecionáveis"
            - name: decoracao
              label: "🌿 Decoração"
            - name: setup
              label: "🎧 Setup & Suportes"
            - name: personalizados
              label: "🎁 Presentes"
            - name: geek
              label: "🎮 Geek & Games"
            - name: iluminacao
              label: "💡 Iluminação & Litofanias"
            - name: utilidades
              label: "🛠️ Utilidades & Casa"
            - name: cosplay
              label: "🎭 Cosplay & Acessórios"
            - name: miniaturas
              label: "🎲 Miniaturas & RPG"
            - name: nova
              label: "✨ Criar Nova Categoria (digitar abaixo)"
      - name: nova_categoria
        label: Criar Nova Categoria (Nome)
        type: string
        description: "Selecione 'Criar Nova Categoria' acima e digite o nome aqui (ex: Canecas, Vasos, Chaveiros). Ela aparecerá automaticamente nos filtros do site!"
      - name: categoria_icone
        label: Emoji da Categoria (Opcional)
        type: string
        description: "Emoji para o botão de filtro (ex: 🏆, ☕, 💎, 🐉). Se vazio, o site escolhe um ícone inteligente."
      - name: descricao
        label: Descrição
        type: text
      - name: imagem
        label: Foto
        type: image
      - name: disponivel
        label: Disponível no Catálogo
        type: boolean
        default: true
      - name: destaque
        label: Exibir nos Destaques (Vitrine do Topo)
        type: boolean
        default: true
        description: "Ative este botão para exibir este produto no carrossel de destaques no topo do site (Showroom). Se desativado, ele continua visível no catálogo abaixo, mas não aparece nos destaques."
      - name: estoque
        label: Estoque a Pronta Entrega (Qtd)
        type: number
        default: 0
        description: "Quantidade de peças já impressas prontas para envio imediato. Se for 1 ou mais, o site ativa o selo de urgência '⚡ Pronta Entrega'. Deixe 0 se a peça for apenas sob encomenda."
