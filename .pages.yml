media:
  input: assets/img/produtos
  output: ./assets/img/produtos

content:
  - name: configuracoes
    label: "⚙️ Configurações da Loja & Frete"
    type: file
    path: configuracoes.json
    fields:
      - name: cep_origem
        label: "CEP de Origem da Loja (Cálculo de Frete)"
        type: string
        default: "29166105"
        description: "CEP de onde saem os envios da Cube Forge (ex: 29166105)."
      - name: melhorenvio_token
        label: "Token da API do Melhor Envio (Opcional)"
        type: string
        description: "Cole seu token Bearer da API do Melhor Envio para cotar na sua conta. Se vazio, o site usa cálculo inteligente de mercado."
      - name: melhorenvio_sandbox
        label: "Usar Sandbox do Melhor Envio (Testes)"
        type: boolean
        default: false
        description: "Marque se estiver usando um token do ambiente de testes sandbox do Melhor Envio."
      - name: habilitar_compra_online
        label: "💳 Habilitar Compra Online no Site (Pix & Cartão até 12x)"
        type: boolean
        default: true
        description: "Ative este botão para permitir compras online diretas no site (Pix e Cartão até 12x via InfinitePay) junto com o WhatsApp. Se desativar, o site funcionará exclusivamente via WhatsApp (pedidos e encomendas combinados diretamente com você)."
      - name: modo_manutencao
        label: "Ativar Modo de Manutenção (Desativar Site & Vendas)"
        type: boolean
        default: false
        description: "Ligue este interruptor para pausar o site temporariamente. O site exibirá um aviso elegante de manutenção informando que volta em breve, pausando as vendas e oferecendo botões diretos de contato via WhatsApp e Instagram."
      - name: titulo_manutencao
        label: "Título do Aviso de Manutenção"
        type: string
        default: "Estamos em Manutenção"
        description: "Título principal na tela de manutenção."
      - name: subtitulo_manutencao
        label: "Subtítulo"
        type: string
        default: "Voltamos em breve com novidades!"
        description: "Frase de apoio abaixo do título."
      - name: mensagem_manutencao
        label: "Mensagem para os Clientes"
        type: text
        default: "Estamos realizando ajustes em nossos equipamentos, estoque e catálogo para trazer peças exclusivas com a máxima qualidade. Nossas compras online voltam em breve!\n\nEnquanto isso, você pode encomendar, orçar ou tirar dúvidas diretamente pelo nosso WhatsApp ou Instagram."
        description: "Texto explicativo detalhado exibido para os clientes durante a pausa."
      - name: previsao_retorno
        label: "Previsão de Retorno (Tag em Destaque)"
        type: string
        default: "Voltamos em breve!"
        description: "Ex: 'Voltamos em breve!', 'Retorno hoje às 19h', 'Previsão: amanhã cedo'."

  - name: categorias
    label: "🏷️ Categorias de Produtos"
    type: file
    path: categorias.json
    list: true
    view:
      primary: nome
      fields: [icone, id, ordem, ativo]
    fields:
      - name: id
        label: "Identificador (slug)"
        type: string
        required: true
        description: "Código da categoria em minúsculas sem espaços (ex: decoracao, colecionaveis, setup, geek, fidgets)."
      - name: nome
        label: "Nome da Categoria"
        type: string
        required: true
        description: "Nome exibido nos botões de filtro e etiquetas do site (ex: Decoração, Colecionáveis, Setup & Suportes)."
      - name: icone
        label: "Emoji ou Ícone"
        type: string
        default: "✨"
        description: "Emoji exibido no botão da vitrine (ex: 🌿, 🐉, 🎧, 🎮, 🌀, 🎁, 💡, 🛠️, 🏆, ☕)."
      - name: ordem
        label: "Ordem de Exibição na Vitrine"
        type: number
        default: 1
        description: "Posição na barra de filtros da loja (1 para primeira, 2 para segunda, etc.)."
      - name: ativo
        label: "Exibir nos Filtros do Site"
        type: boolean
        default: true
        description: "Ligue para exibir esta categoria nos filtros de produtos do site."

  - name: produtos
    label: "📦 Catálogo de Produtos"
    type: file
    path: produtos.json
    list: true
    view:
      primary: nome
      fields: [preco, categoria, estoque]
    fields:
      - name: id
        label: "ID do Produto"
        type: number
        description: "Número identificador único do produto (ex: 1, 2, 3...)."
      - name: nome
        label: "Nome do Produto"
        type: string
        required: true
        description: "Nome principal da peça exibido na vitrine e nos detalhes."
      - name: preco
        label: "Preço (R$)"
        type: string
        required: true
        description: "Digite apenas o valor (ex: 50 para R$ 50,00 ou 24,99 para R$ 24,99). Não precisa digitar R$ nem os zeros finais, o site formata automaticamente!"
      - name: categoria
        label: "Categoria do Produto"
        type: select
        default: "decoracao"
        description: "Selecione a categoria deste produto no catálogo da loja."
        options:
          values:
            - name: "decoracao"
              label: "🌿 Decoração"
            - name: "colecionaveis"
              label: "🐉 Colecionáveis"
            - name: "setup"
              label: "🎧 Setup & Suportes"
            - name: "geek"
              label: "🎮 Geek & Games"
            - name: "fidgets"
              label: "🌀 Fidgets"
            - name: "personalizados"
              label: "🎁 Presentes & Personalizados"
            - name: "iluminacao"
              label: "💡 Iluminação & Litofanias"
            - name: "utilidades"
              label: "🛠️ Utilidades & Casa"
            - name: "cosplay"
              label: "🎭 Cosplay & Acessórios"
            - name: "miniaturas"
              label: "🎲 Miniaturas & RPG"
            - name: "nova"
              label: "✨ Outra Categoria (digite abaixo)"
      - name: nova_categoria
        label: "Ou criar Nova Categoria (se escolheu 'Outra Categoria' acima)"
        type: string
        description: "Caso queira criar uma categoria rápida, digite o nome aqui (ex: Canecas, Chaveiros). Ela aparecerá automaticamente na vitrine do site!"
      - name: descricao
        label: "Descrição da Peça"
        type: text
        description: "Breve texto explicativo para o cliente sobre o produto."
      - name: imagem
        label: "Foto Principal do Produto"
        type: image
        description: "Foto principal exibida no catálogo e no carrossel de destaques."
      - name: cores
        label: "🎨 Variações de Cores & Fotos (Opcional)"
        type: object
        list: true
        fields:
          - name: nome
            label: "Nome da Cor"
            type: string
            required: true
            description: "Nome exibido para o cliente (ex: Azul Ciano, Branco Polar, Preto Fosco, etc.)."
          - name: hex
            label: "Selecione a Cor da Bolinha (Sem digitar código!)"
            type: select
            default: "#00d2ff"
            description: "Basta clicar e escolher a cor nesta lista com emojis. Você não precisa saber nem digitar nenhum código!"
            options:
              values:
                - name: "#00d2ff"
                  label: "🔵 Azul Ciano"
                - name: "#ffffff"
                  label: "⚪ Branco Polar"
                - name: "#111827"
                  label: "⚫ Preto / Ônix"
                - name: "#a855f7"
                  label: "🟣 Roxo / Púrpura"
                - name: "#fbbf24"
                  label: "🟡 Amarelo Sol"
                - name: "#ef4444"
                  label: "🔴 Vermelho Rubi"
                - name: "#22c55e"
                  label: "🟢 Verde Neon / Lima"
                - name: "#ff6a00"
                  label: "🟠 Laranja Cítrico"
                - name: "#eab308"
                  label: "🪙 Dourado / Ouro Metálico"
                - name: "#94a3b8"
                  label: "🥈 Prata / Cinza Metálico"
                - name: "#ec4899"
                  label: "🌸 Rosa Pastel / Pink"
                - name: "#2563eb"
                  label: "🔷 Azul Royal / Escuro"
                - name: "#06b6d4"
                  label: "🩵 Turquesa / Aqua"
                - name: "#b45309"
                  label: "🤎 Bronze / Cobre"
                - name: "#374151"
                  label: "🔘 Grafite Escuro"
                - name: "auto"
                  label: "✨ Automático (Detectar pela cor escrita no nome)"
          - name: hex_personalizado
            label: "Ou código Hex customizado (Opcional)"
            type: string
            description: "Deixe em branco para usar a cor selecionada na lista acima! Preencha apenas se quiser um tom específico que não esteja na lista."
          - name: imagem
            label: "Foto desta Cor"
            type: image
            description: "Foto do produto nesta cor. Ao clicar na bolinha no site, a imagem principal mudará instantaneamente para esta foto!"
      - name: destaque
        label: "⭐ Exibir nos Destaques (Showroom do Topo)"
        type: boolean
        default: true
        description: "Ative este botão para exibir este produto no carrossel de destaques no topo do site (Showroom). Se desativado, ele continua visível no catálogo abaixo, mas não aparece nos destaques."
      - name: disponivel
        label: "👁️ Disponível no Catálogo (Visível na Loja)"
        type: boolean
        default: true
        description: "Desative para ocultar temporariamente este produto da loja sem precisar apagá-lo."
      - name: somente_encomenda
        label: "📦 Somente sob Encomenda"
        type: boolean
        default: false
        description: "Ative este botão para produtos fabricados exclusivamente sob encomenda. Ele continuará aparecendo no catálogo e no carrinho com o selo '📦 Somente sob Encomenda', a compra online fica desativada e o cliente tem a opção de encomendar diretamente pelo WhatsApp."
      - name: estoque
        label: "⚡ Estoque a Pronta Entrega (Qtd)"
        type: number
        default: 0
        description: "Quantidade de peças já impressas prontas para envio imediato. Se for 1 ou mais, o site ativa o selo de urgência '⚡ Pronta Entrega'. Deixe 0 se a peça for apenas sob encomenda."
