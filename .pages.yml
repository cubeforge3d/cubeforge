media:
  input: assets/img/produtos
  output: ./assets/img/produtos

content:
  # ==========================================================================
  # 1. Catálogo Ativo (No Ar na Loja)
  # ==========================================================================
  - name: produtos
    label: "🛍️ Catálogo Ativo (No Ar)"
    type: file
    path: produtos.json
    list:
      collapsible:
        collapsed: true
        summary: "{nome} — {preco}"
    fields:
      - name: disponivel
        label: "✅ Disponível no Catálogo (Ativo / Inativo)"
        type: boolean
        default: true
        description: "Mantenha ativado para o produto aparecer na vitrine. Desmarque para ocultar da loja."
      - name: nome
        label: Nome do Produto
        type: string
        required: true
        description: "Nome principal exibido na vitrine e nos orçamentos."
      - name: preco
        label: Preço / Faixa de Preço
        type: string
        required: true
        description: "Ex: 'R$ 35,00', 'R$ 49,90' ou 'A partir de R$ 30'."
      - name: categoria
        label: Categoria
        type: select
        options:
          placeholder: "Selecione uma categoria..."
          values:
            - name: colecionaveis
              label: "🐉 Colecionáveis"
            - name: decoracao
              label: "🌿 Decoração"
            - name: setup
              label: "🎧 Setup & Suportes"
            - name: personalizados
              label: "🎁 Presentes & Brindes"
            - name: geek
              label: "🎮 Geek & Games"
            - name: iluminacao
              label: "💡 Iluminação & Litofanias"
            - name: utilidades
              label: "🛠️ Utilidades & Casa"
            - name: cosplay
              label: "🎭 Cosplay & Acessórios"
            - name: miniaturas
              label: "🎲 Miniaturas & RPG"
            - name: sob-encomenda
              label: "📦 Peças Sob Encomenda"
            - name: nova
              label: "✨ Criar Nova Categoria (digitar abaixo)"
      - name: nova_categoria
        label: Criar Nova Categoria (Nome)
        type: string
        description: "Selecione 'Criar Nova Categoria' acima e digite o nome aqui (ex: Canecas, Vasos, Chaveiros). Ela aparecerá automaticamente nos filtros e na busca do site!"
      - name: categoria_icone
        label: Emoji ou Ícone da Categoria (Opcional)
        type: string
        description: "Emoji para o botão de filtro (ex: 🏆, ☕, 💎, 🐉). Se vazio, o site escolhe um ícone inteligente."
      - name: estoque
        label: "⚡ Estoque a Pronta Entrega (Qtd)"
        type: number
        default: 0
        description: "Quantidade de peças já impressas para envio imediato. Se for 1 ou mais, ganha o selo de urgência '⚡ Pronta Entrega'."
      - name: somente_encomenda
        label: "📦 Fabricação Somente sob Encomenda"
        type: boolean
        default: false
        description: "Ative caso esta peça seja fabricada somente sob encomenda."
      - name: selo_personalizado
        label: "Selo Especial / Badge (Opcional)"
        type: string
        description: "Texto de destaque no topo da foto (ex: '🔥 Mais Vendido', '⭐ Novidade', '💎 Sob Medida')."
      - name: ordem
        label: "Ordem de Exibição (Prioridade)"
        type: number
        default: 10
        description: "Defina a posição no catálogo: números menores aparecem primeiro (ex: 1, 2, 3)."
      - name: tags
        label: "Palavras-chave para Busca (Tags de Pesquisa)"
        type: string
        description: "Termos adicionais separados por vírgula para busca no site (ex: anime, naruto, presente, suporte, celular, gamer)."
      - name: descricao
        label: Descrição do Produto
        type: text
        description: "Breve explicação sobre os detalhes da peça, materiais e aplicações."
      - name: imagem
        label: Foto do Produto
        type: image
        description: "Imagem da peça já impressa ou render de alta qualidade."
      - name: destaque
        label: "⭐ Exibir nos Destaques (Showroom do Topo)"
        type: boolean
        default: true
        description: "Ative para exibir este produto no carrossel de destaques no topo do site para PC."
      - name: id
        label: ID do Produto
        type: number
        description: "Identificador numérico único do produto."

  # ==========================================================================
  # 2. Produtos Somente Sob Encomenda
  # ==========================================================================
  - name: produtos_encomenda
    label: "📦 Somente Sob Encomenda"
    type: file
    path: produtos_encomenda.json
    list:
      collapsible:
        collapsed: true
        summary: "{nome} — {preco}"
    fields:
      - name: disponivel
        label: "✅ Disponível no Catálogo (Ativo / Inativo)"
        type: boolean
        default: true
        description: "Mantenha ativo para o produto aparecer na vitrine e na aba Sob Encomenda."
      - name: somente_encomenda
        label: "📦 Fabricação Somente sob Encomenda"
        type: boolean
        default: true
        description: "Peça fabricada sob medida. O pedido é direcionado automaticamente para orçamento no WhatsApp."
      - name: nome
        label: Nome da Peça Sob Encomenda
        type: string
        required: true
        description: "Nome da peça personalizada."
      - name: preco
        label: Preço / Faixa de Preço
        type: string
        required: true
        description: "Ex: 'R$ 65,00', 'A partir de R$ 50' ou 'Consulte'."
      - name: categoria
        label: Categoria
        type: select
        options:
          values:
            - name: decoracao
              label: "🌿 Decoração"
            - name: iluminacao
              label: "💡 Iluminação & Litofanias"
            - name: colecionaveis
              label: "🐉 Colecionáveis"
            - name: setup
              label: "🎧 Setup & Suportes"
            - name: personalizados
              label: "🎁 Presentes & Personalizados"
            - name: utilidades
              label: "🛠️ Utilidades & Casa"
            - name: cosplay
              label: "🎭 Cosplay & Acessórios"
            - name: miniaturas
              label: "🎲 Miniaturas & RPG"
            - name: sob-encomenda
              label: "📦 Peças Sob Encomenda"
            - name: nova
              label: "✨ Criar Nova Categoria"
      - name: nova_categoria
        label: Criar Nova Categoria (Nome)
        type: string
      - name: categoria_icone
        label: Emoji ou Ícone da Categoria (Opcional)
        type: string
      - name: selo_personalizado
        label: "Selo Especial / Badge (Opcional)"
        type: string
        default: "💎 Sob Medida"
      - name: ordem
        label: "Ordem de Exibição"
        type: number
        default: 10
      - name: tags
        label: "Palavras-chave para Busca (Tags)"
        type: string
      - name: descricao
        label: Descrição do Produto
        type: text
      - name: imagem
        label: Foto do Produto
        type: image
      - name: destaque
        label: "⭐ Exibir nos Destaques (Showroom)"
        type: boolean
        default: true
      - name: id
        label: ID do Produto
        type: number

  # ==========================================================================
  # 3. Fora do Catálogo (Pausados / Guardados)
  # ==========================================================================
  - name: produtos_pausados
    label: "⏸️ Fora do Catálogo (Pausados)"
    type: file
    path: produtos_pausados.json
    list:
      collapsible:
        collapsed: true
        summary: "{nome} — {preco}"
    fields:
      - name: disponivel
        label: "✅ Ativar e Colocar de Volta no Catálogo"
        type: boolean
        default: false
        description: "Basta ativar este botão para este produto voltar a aparecer imediatamente na vitrine da loja sem precisar recadastrá-lo!"
      - name: nome
        label: Nome do Produto Pausado
        type: string
        required: true
      - name: preco
        label: Preço
        type: string
        required: true
      - name: categoria
        label: Categoria
        type: select
        options:
          values:
            - name: colecionaveis
              label: "🐉 Colecionáveis"
            - name: decoracao
              label: "🌿 Decoração"
            - name: setup
              label: "🎧 Setup & Suportes"
            - name: personalizados
              label: "🎁 Presentes"
            - name: geek
              label: "🎮 Geek & Games"
            - name: iluminacao
              label: "💡 Iluminação & Litofanias"
            - name: utilidades
              label: "🛠️ Utilidades & Casa"
            - name: cosplay
              label: "🎭 Cosplay"
            - name: miniaturas
              label: "🎲 Miniaturas & RPG"
            - name: nova
              label: "✨ Criar Nova Categoria"
      - name: nova_categoria
        label: Criar Nova Categoria (Nome)
        type: string
      - name: estoque
        label: "⚡ Estoque a Pronta Entrega (Qtd)"
        type: number
        default: 0
      - name: somente_encomenda
        label: "📦 Fabricação Somente sob Encomenda"
        type: boolean
        default: false
      - name: selo_personalizado
        label: "Selo Especial"
        type: string
      - name: ordem
        label: "Ordem de Exibição"
        type: number
        default: 50
      - name: tags
        label: "Tags de Pesquisa"
        type: string
      - name: descricao
        label: Descrição do Produto
        type: text
      - name: imagem
        label: Foto do Produto
        type: image
      - name: destaque
        label: "⭐ Exibir nos Destaques"
        type: boolean
        default: false
      - name: id
        label: ID do Produto
        type: number

  # ==========================================================================
  # 4. Configurações da Loja, Contatos & Avisos
  # ==========================================================================
  - name: configuracoes
    label: "⚙️ Configurações da Loja & Avisos"
    type: file
    path: configuracoes.json
    fields:
      - name: whatsapp_numero
        label: "Número de WhatsApp da Loja"
        type: string
        default: "5527936183114"
        description: "Número completo com DDI e DDD, apenas números. Ex: 5527936183114."
      - name: whatsapp_display
        label: "WhatsApp Visível no Rodapé"
        type: string
        default: "(27) 93618-3114"
        description: "Texto formatado do WhatsApp exibido para o público."
      - name: instagram_user
        label: "Usuário do Instagram (sem @)"
        type: string
        default: "cubeforge3d"
        description: "Usuário do Instagram para links e redirecionamentos."
      - name: chave_pix
        label: "Chave Pix para Pagamentos"
        type: string
        default: "pix@cubeforge.com.br"
        description: "Chave Pix exibida na etapa de pagamento do carrinho."
      - name: banner_alerta_ativo
        label: "Ativar Faixa de Aviso no Topo do Site"
        type: boolean
        default: false
        description: "Ative para exibir uma faixa destacada no topo com recados especiais, promoções ou avisos."
      - name: banner_alerta
        label: "Mensagem da Faixa de Aviso"
        type: string
        default: "🚀 Peças exclusivas em 3D de alta resolução sob encomenda e a pronta entrega!"
        description: "Texto da faixa de aviso que aparecerá no topo do site quando ativada."
      - name: modo_manutencao
        label: "Ativar Modo de Manutenção (Desativar Site & Vendas)"
        type: boolean
        default: false
        description: "Ligue este interruptor para pausar o site temporariamente. O site exibirá um aviso elegante de manutenção informando que volta em breve."
      - name: titulo_manutencao
        label: "Título do Aviso de Manutenção"
        type: string
        default: "Estamos em Manutenção"
      - name: subtitulo_manutencao
        label: "Subtítulo da Manutenção"
        type: string
        default: "Voltamos em breve com novidades!"
      - name: mensagem_manutencao
        label: "Mensagem de Manutenção para os Clientes"
        type: text
        default: "Estamos realizando ajustes em nossos equipamentos, estoque e catálogo para trazer peças exclusivas com a máxima qualidade. Nossas compras online voltam em breve!\n\nEnquanto isso, você pode encomendar, orçar ou tirar dúvidas diretamente pelo nosso WhatsApp ou Instagram."
      - name: previsao_retorno
        label: "Previsão de Retorno (Tag em Destaque)"
        type: string
        default: "Voltamos em breve!"
